<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Async Inference Engine</title>
    <meta name="description" content="Chat with a batched sentiment model running on an async inference pipeline." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="model">
          <img src="/favicon.svg" alt="" width="22" height="22" />
          <span>Async Inference</span>
          <span class="model-tag">DistilBERT · sentiment</span>
        </div>
        <div class="topbar-actions">
          <span class="status" id="engine-status" data-state="checking">Checking…</span>
          <a class="icon-button" href="https://github.com/raman2221/async-inference-engine" target="_blank" rel="noreferrer" aria-label="Source code on GitHub">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.08.63-1.33-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.56 9.56 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z" /></svg>
          </a>
          <button class="icon-button" id="new-chat" type="button" aria-label="New chat" title="New chat">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 20h4l10.5-10.5-4-4L4 16v4zM13.5 7.5l3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
        </div>
      </header>

      <main class="main" id="main" data-empty="true">
        <section class="welcome" id="welcome">
          <h1>What should I read the mood of?</h1>
        </section>

        <div class="thread" id="thread" aria-live="polite"></div>

        <div class="composer-area">
          <form class="composer" id="composer">
            <label class="visually-hidden" for="composer-input">Message</label>
            <textarea id="composer-input" rows="1" maxlength="2000" placeholder="Message the engine…"></textarea>
            <button class="send" id="send-button" type="submit" aria-label="Send" disabled>
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
          </form>

          <div class="suggestions" id="suggestions">
            <button type="button" class="suggestion" data-text="This is the best concert I have ever been to.">😊 A happy review</button>
            <button type="button" class="suggestion" data-text="The update broke everything and support never replied.">😠 An angry email</button>
            <button
              type="button"
              class="suggestion"
              data-text="I loved every minute of it.&#10;Worst customer service ever.&#10;The food arrived hot and fresh.&#10;It stopped working after two days.&#10;Honestly better than I expected."
            >
              📦 Five at once (batched)
            </button>
          </div>

          <p class="footnote">
            Each line is its own request. Lines sent together can share one forward pass.
            <kbd>Shift</kbd> + <kbd>Enter</kbd> for a new line.
          </p>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
